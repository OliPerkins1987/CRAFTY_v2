# Configuration for CRAFTY Model

project_path: '---'

scenario: 'ssp445'                              # Scenario identifier
regionalisation: false						            # Only works if regional data is available (regional demands and GIS cell specificity).
# CRAFTY Mechanisms
# Utility calculation
initial_demand_supply_equilibrium: true       # Ensure balanced eco-service supply and demand during initial tick
remove_negative_marginal_utility: false       # Set marginal utility of production to 0 if negative
separate_production_competitiveness: false     # When true, productivity returns raw yield; competitiveness uses capital-adjusted Cobb-Douglas

# Utility used in competition
use_explicit_price_utility: false              # Utility = price * productivity - costs (standalone explicit-price model)
use_price_only_utility: false                  # Utility = (price_t / price_t0) * productivity (PLUM coupling price-ratio mode)
use_normalised_price_competition: false        # Use normalised difference competition: (uC-uO)/(|uC|+|uO|) with uC<=0 guard

# Price feedback (explicit-price utility only; assumes production costs are on)
# Price = file price x max(0, 1 + price_feedback_strength x (demand - supply) / demand), refreshed with marginal utility.
use_price_feedback: false                      # Requires use_explicit_price_utility; oversupply lowers the price, a shortage raises it
price_feedback_strength: 0.03                  # >= 0 (0.03 is PLUM's value); 0 = no feedback; with no supply the price is at most (1 + strength) x file price

# Giving up methods
use_abandonment_threshold: true               # Abandon cell if agent competitiveness falls below threshold
use_price_explicit_giving_up: false           # Deterministic give-up: agent abandons when utility + subsidy < 0 (mutually exclusive with use_abandonment_threshold)
prescribed_subsidies_path: ''                  # Used for historical calibration when subsidies are read from file

# Production costs
use_production_costs: false                    # Enable production cost subtraction from utility (explicit-price mode only)
spatial_production_costs: false                 # When true, costs are read per-cell from spatial CSV; when false, global per-AFT costs apply
costs_directory: ''                            # Directory containing production cost CSVs (required when use_production_costs is true)

most_competitive_aft_probability: 0.8         # Probability of selecting the highest-utility AFT for cell
averaged_residual_demand_per_cell: false      # Averaged residual demand for each cell
use_cell_area: false                          # Supply = production x cell area, areas from the GIS file's Area column; false: every cell counts as 1

# Neighbouring effects
use_neighbour_priority: true                   # Prioritise AFTs in neighbouring cells for land competition
neighbour_priority_probability: 0.95           # Probability of applying neighbour priority
neighbour_radius: 2                            # Radius defining the neighbourhood when enabled

# Competitiveness Process
cell_selection: rank                          # rank: lowest utility; random: seeded pseudo-random cells
random_seed: 1                                # Fixed seed used by every stochastic model decision
land_abandonment_fraction: 0.03                # Fraction of land that can be abandoned per tick
participating_cell_fraction: 0.03              # Fraction of cells participating in competition
unmanaged_cell_takeover_fraction: 0.8
marginal_utility_calculations_per_tick: 10     # Number of times the marginal utility calculated per tick

# Twinned AFTs
# Allows a pair of AFTs (e.g. irrigated/rainfed) to compete at a separate, higher frequency.
# Twin relationships are declared via "Twin" and "Twin_cost" columns in AFTsMetaData CSV.
use_twinned_afts: false                        # Enable twinned AFT competition pass (additive to standard competition)
use_twinned_cost: false                        # Use cost-based takeover rule instead of standard give-in dispatch
twinned_competition_rate: 1.0                  # Fraction of eligible twin-owned cells checked per tick [0,1]

# Conversion cost (explicit-price utility only)
# Owner's "Conversion_cost" (AFTsMetaData) is added to its utility when challenged by an AFT from another Category.
# Needs Conversion_cost and Category columns in AFTsMetaData. Designed for use_normalised_price_competition.
use_conversion_cost: false                     # Requires use_explicit_price_utility

# Matrix give-in
# The give-in threshold is read from an owner (row) x challenger (column) matrix: Aft_give_in_matrix.csv, or
# Aft_give_in_matrix_<year>.csv for one year. Looked for in aft_behaviour_parameters_directory when set, otherwise
# in AFTs/agents/default_behaviour/. A blank cell falls back to the owner's givingInDistributionMean.
use_matrix_give_in: false                      # Requires use_category_based_give_in: false (it defaults to true)

# Land-control directories can contain one or more mask inputs.

# Output Configuration
generate_output_files: true                   # Enable CSV file output
output_folder_name: ''                        # If left empty defaults to timestamped folder,project_path\output\scenario\output_folder_name
generate_chart_plots_png: true

generate_map_output_files: true
map_output_years: 5      # Single integer N: export maps every N years; list [N1,...,Nm]: export maps for these exact years Ni
track_changes: true                         # Enable change tracking in output
export_logger: true
logger_info: true
logger_warn: true
logger_trace: false
