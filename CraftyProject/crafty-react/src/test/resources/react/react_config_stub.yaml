# CRAFTY-react configuration
#
# Location: <project_path>/AFTs/react/react_config.yaml (fixed; crafty-core does not know about this file).
# Every key is optional. A missing key, or a missing file, uses the built-in default shown here.
# Unknown keys stop the run.
#
# Paths are relative to project_path. Placeholders:
#   {scenario}  the scenario from config.yaml (e.g. ssp126)
#   {year}      the model year
#   {type}      a service's LPJG_type from csv/Services.csv (crops / pasture / forestry)
#
# Written 2026-09-17 from the phase 1 plan. Every value here is the built-in default.
# Read by CRAFTY-react from patch 27a; the tunable settings are first used in phases 3-4.

inputs:
  # --- files read once ---------------------------------------------------------------
  parameters:        AFTs/react/Reactive_parameters.csv     # one row per AFT; react_ columns only
  base_costs:        costs/global/global_costs.csv          # Nfert, Water, Stocking + one row per reactive service
  cell_key:          worlds/react/cell_key.csv              # CRAFTY X,Y -> LPJ_cell_x, LPJ_cell_y
  irrigation_cost:   worlds/react/irrigation/Irrigation_cost.csv   # aridity index 0-1, scales Water

  # --- year folders: any file name; the one .csv whose name contains the year is used -----
  suitabilities:     worlds/react/suitabilities/{scenario}/{type}
  capitals:          worlds/react/capitals/{scenario}

  # --- named per-year files (demand and runoff share a folder) ------------------------------
  irrigation_demand: worlds/react/irrigation/{scenario}/Irrigation_demand_{year}.csv
  runoff:            worlds/react/irrigation/{scenario}/Runoff_{year}.csv

  # --- how to read the files --------------------------------------------------------------
  yield_file_units:      kg_per_m2    # crop yields and pasture NPP: kg_per_m2 (x10 -> t/ha) or t_per_ha
  irrigation_file_units: mm           # demand and runoff: mm (x10 -> m3/ha) or m3_per_ha

# --- tunable settings (read by phases 3-4; phase 1 only loads and checks them) ------------
spinup_iterations: 5          # iterations at the start year before single-step yearly updates

n_max_factor: 1.5             # Nmax = n_max_factor x react_N_anchor (Nmin = 0)
n_adjustment_scale: 0.15      # scales the prospect-theory N step

prospect:                     # prospect-theory value function; the reference point is
                              # each Prospect AFT's react_N_par (default 0), not a setting
  alpha: 0.88                 # gains exponent
  beta: 0.88                  # losses exponent
  lambda: 2.25                # loss aversion

stocking:                     # pasture stocking rate
  initial: 0.5                # starting value before spin-up
  step: 0.05
  min: 0.05
  max: 1.0
  harvest: 0.5                # the most of the pasture NPP that can be taken off (0-1);
                              # the stocking rate sets how much of that is

yield_tech_change: 0          # crop yield change per year from technology: yields are multiplied by
                              # (1 + yield_tech_change x years since start_year); 0 = no change
